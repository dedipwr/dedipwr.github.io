        } else {
            document.getElementById("Header").classList.remove("sticky-top");
			document.getElementById("HeaderItmS").classList.add("hiddenS");
			document.getElementById("HeaderItmS").classList.remove("HeaderItm");
			document.getElementById("HeaderItmR").style.display = "";
			
            // remove padding top from body
            body = document.querySelector('body');
			main = document.getElementById('main');
        	body.setAttribute("style", "padding-top: 0; margin-top: 0;");
			main.setAttribute("style", "padding-top: 0;");
        }
    });
})
